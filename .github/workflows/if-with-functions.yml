name: Nice If Example
on:
  push:
    branches:
      - main
      - develop
      - feature/**

jobs:
  quality-check:
    if: startsWith(github.ref_name, 'feature') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Perform code quality
        run: echo "Performing code quality checks..."

  dev_deploy:
    if: github.ref_name == 'develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to development
        run: echo "Deploying to development environment..."

  prod_deploy:
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Perform prod deploy
        run: echo "Deploying to production environment..."

  success_notify:
    needs: [quality-check, dev_deploy, prod_deploy]
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        run: echo "Notifying success..."

  failure_notify:
    needs: [quality-check, dev_deploy, prod_deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        run: echo "Notifying failure..."
